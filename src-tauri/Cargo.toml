[package]
name = "loquazx"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loquazx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
uuid = { version = "1.23.3", features = ["v4"] }
whisper-rs = "0.16.0"
hound = "3.5.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
msedge-tts = "0.4.0"
# Necesario para fijar el proveedor criptográfico de rustls (aws-lc-rs y ring
# coexisten en el árbol vía reqwest/edge-tts; sin default explícito, rustls
# entra en pánico al abrir el WebSocket de edge-tts).
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# Motor de traducción local NLLB (ADR-008 revisado): inferencia ONNX (`ort`,
# backend compartido con Piper/ADR-009) más el tokenizer SentencePiece del modelo.
ort = "2.0.0-rc.12"
tokenizers = "0.21"
piper-rs = "0.2.0"

[dev-dependencies]
tempfile = "3.27.0"

